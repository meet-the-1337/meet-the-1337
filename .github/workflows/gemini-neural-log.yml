name: Update Gemini AI Neural Log

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'scripts/gemini_neural_log.py'

jobs:
  update-neural-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Gemini Neural Log Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gemini_neural_log.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Hermes AI Agent [Bot]"
          git config --global user.email "hermes-agent@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Gemini AI] Synchronize daily neural transmission log" && git push)
