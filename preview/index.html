<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meet-the-1337 • GitHub Profile Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px 10px 80px 10px;
      display: flex;
      justify-content: center;
    }
    .profile-container {
      width: 100%;
      max-width: 900px;
      padding: 32px 40px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
    .markdown-body {
      background-color: transparent !important;
      font-size: 14px;
      line-height: 1.5;
    }
    .markdown-body pre { background: #161b22 !important; border: 1px solid #30363d !important; }
    .markdown-body table tr { background-color: #0d1117 !important; border-top: 1px solid #21262d !important; }
    .markdown-body table td, .markdown-body table th { border: 1px solid #30363d !important; padding: 8px 13px; }
    .markdown-body hr { background-color: #21262d !important; }
    .markdown-body details { border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin: 8px 0; }
    .markdown-body details summary { cursor: pointer; font-weight: 600; }
    .markdown-body blockquote { border-left: 3px solid #3b434b; color: #8b949e; }
    .live-badge {
      position: fixed; bottom: 16px; right: 16px;
      background: rgba(13,17,23,0.95); border: 1px solid #30363d;
      color: #58a6ff; padding: 6px 14px; border-radius: 6px;
      font-family: monospace; font-size: 11px; z-index: 999;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <article id="content" class="markdown-body"><p style="color:#8b949e">Loading...</p></article>
  </div>
  <div class="live-badge">● live preview</div>
  <script>
    marked.setOptions({ gfm: true, breaks: true });
    let last = "";
    async function load() {
      try {
        const r = await fetch('../README.md?t=' + Date.now());
        const md = await r.text();
        if (md !== last) {
          last = md;
          document.getElementById('content').innerHTML = marked.parse(md.replace(/\.\/assets\//g, '../assets/'));
        }
      } catch(e) {}
    }
    load();
    setInterval(load, 1500);
  </script>
</body>
</html>
